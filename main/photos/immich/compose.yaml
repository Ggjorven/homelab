networks:
  photos-network:
    name: photos-network
    external: true

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION?required}
    container_name: immich-server
    user: ${PUID}:${PGID}
    environment:
      - UPLOAD_LOCATION=/data
      - REDIS_HOSTNAME=172.24.1.12
      - DB_HOSTNAME=172.24.1.13
      - DB_DATABASE_NAME=immich-database
      - DB_USERNAME=${DATABASE_USERNAME:-immich-user}
      - DB_PASSWORD=${DATABASE_PASSWORD}
      - DB_DATA_LOCATION=./database
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ${PHOTOS_FOLDER}:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      photos-network:
        ipv4_address: 172.24.1.10
    ports:
      - "0.0.0.0:2283:2283"
    depends_on:
      - immich-redis
      - immich-database
    gpus: all
    runtime: nvidia
    healthcheck:
      test: immich-healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION?required}
    container_name: immich-machine-learning
    user: ${PUID}:${PGID} # Idk yet
    environment:
      - IMMICH_VERSION=${IMMICH_VERSION}
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ./ml-cache:/cache
      - /etc/localtime:/etc/localtime:ro
    networks:
      photos-network:
        ipv4_address: 172.24.1.11
    runtime: nvidia
    gpus: all
    healthcheck:
      test: python3 healthcheck.py
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:930b41430fb727f533c5982fe509b6f04233e26d0f7354e04de4b0d5c706e44e
    container_name: immich-redis
    # user: ${PUID}:${PGID} # Runs as valkey:valkey already internally
    environment:
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    networks:
      photos-network:
        ipv4_address: 172.24.1.12
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  immich-database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-database
    # user: ${PUID}:${PGID} # Postgres run internally as 999:999
    environment:
      - TZ=${TZ}
      - POSTGRES_DB=immich-database
      - POSTGRES_USER=${DATABASE_USERNAME:-immich-user}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
      - ./database:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      photos-network:
        ipv4_address: 172.24.1.13
    healthcheck:
      test: /usr/local/bin/healthcheck.sh
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 15s
    shm_size: 128mb
    restart: unless-stopped

  # TODO: Prometheus exporter
