# =============================================================================
# INPUT CHAIN, Proxmox host defaults (LAN-open style)
# Default policy: DROP
# =============================================================================
chain input {
    type filter hook input priority 0; policy drop;

    # -------------------------------------------------------------------------
    # Loopback + stateful tracking
    # -------------------------------------------------------------------------
    iifname lo                                  accept
    ct state established,related                accept
    ct state invalid                            drop

    # -------------------------------------------------------------------------
    # ICMP, allow ping from LAN
    # -------------------------------------------------------------------------
    ip saddr $NET_LAN icmp type echo-request    accept

    # -------------------------------------------------------------------------
    # SSH, LAN access (port 22)
    # -------------------------------------------------------------------------
    ip saddr $NET_LAN tcp dport 22              accept

    # -------------------------------------------------------------------------
    # Proxmox Web UI, LAN access (port 8006)
    # -------------------------------------------------------------------------
    ip saddr $NET_LAN tcp dport 8006            accept

    # -------------------------------------------------------------------------
    # SPICE, LAN access (port 3128), used for VM console via virt-viewer
    # -------------------------------------------------------------------------
    ip saddr $NET_LAN tcp dport 3128            accept

    # -------------------------------------------------------------------------
    # Catch-all: log and drop
    # -------------------------------------------------------------------------
    log prefix "INPUT-DROP: " level warn        drop
}
