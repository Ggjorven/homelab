# =============================================================================
# NAT, outbound masquerade and inbound port forwards
# =============================================================================
chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;

    # Masquerade all internal VLAN traffic going to the internet.
    ip saddr $NET_ALL_INTERNAL oifname $WAN_IF masquerade
}

chain prerouting {
    type nat hook prerouting priority dstnat; policy accept;

    # Inbound HTTP/HTTPS -> DMZ reverse proxy.
    # Your router should port-forward 80+443 to the Proxmox host's LAN IP,
    # then this rule redirects it into the DMZ VLAN.
    iifname $WAN_IF tcp dport $PORTS_HTTP dnat to $IP_NETWORK

    # Add additional port forwards here, e.g.:
    # iifname $WAN_IF tcp dport 8006 dnat to $IP_MEDIA   # Direct Jellyfin
}
