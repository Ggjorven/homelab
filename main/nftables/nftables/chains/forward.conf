# =============================================================================
# FORWARD CHAIN, inter-VLAN routing policy
# Default policy: DROP. All inter-VLAN access must be explicitly whitelisted.
# =============================================================================
chain forward {
    type filter hook forward priority 0; policy drop;

    # -------------------------------------------------------------------------
    # Stateful tracking, always first
    # -------------------------------------------------------------------------
    ct state established,related accept
    ct state invalid drop

    # =========================================================================
    # SECTION: STORAGE VLAN (100), Only internet access
    # =========================================================================
	ip saddr $NET_STORAGE ip daddr $NET_ALL_INTERNAL drop

    ip saddr $NET_STORAGE oifname $WAN_IF accept

    # =========================================================================
    # SECTION: MEDIA VLAN (101), Only internet access
    # =========================================================================
    ip saddr $NET_MEDIA ip daddr $NET_ALL_INTERNAL drop

	ip saddr $NET_MEDIA oifname $WAN_IF accept

    # =========================================================================
    # SECTION: PRIVNET VLAN (113), Internet + Media (8096)
    # =========================================================================
	ip saddr $NET_PRIVNET ip daddr $IP_MEDIA tcp dport 8096 accept

	ip saddr $NET_PRIVNET oifname $WAN_IF accept

	ip saddr $NET_PRIVNET ip daddr $NET_ALL_INTERNAL drop

    # =========================================================================
    # CATCH-ALL: Log and drop unmatched forward attempts (final drop rule)
    # =========================================================================
    log prefix "FORWARD-DROP: " level warn drop
}
