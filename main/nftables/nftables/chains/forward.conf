# =============================================================================
# FORWARD CHAIN, inter-VLAN routing policy
# Default policy: DROP. All inter-VLAN access must be explicitly whitelisted.
# =============================================================================
chain forward {
    type filter hook forward priority 0; policy drop;

    # -------------------------------------------------------------------------
    # Stateful tracking, always first
    # -------------------------------------------------------------------------
    ct state established,related accept
    ct state invalid drop

    # =========================================================================
    # SECTION: STORAGE VLAN (100), Only internet access
    # =========================================================================
	ip saddr $NET_STORAGE ip daddr $NET_ALL_INTERNAL drop

    ip saddr $NET_STORAGE oifname $WAN_IF accept

    # =========================================================================
    # SECTION: MEDIA VLAN (101), Internet + Basic *Arr
    # =========================================================================
	ip saddr $NET_MEDIA ip daddr $IP_ARR tcp dport $PORT_RADARR accept
	ip saddr $NET_MEDIA ip daddr $IP_ARR tcp dport $PORT_SONARR accept

    ip saddr $NET_MEDIA ip daddr $NET_ALL_INTERNAL drop

	ip saddr $NET_MEDIA oifname $WAN_IF accept

    # =========================================================================
    # SECTION: PHOTOS VLAN (103), Only internet access
    # =========================================================================
	ip saddr $NET_PHOTOS ip daddr $NET_ALL_INTERNAL drop

    ip saddr $NET_PHOTOS oifname $WAN_IF accept

    # =========================================================================
    # SECTION: ARR VLAN (105), Internet + Media (Jellyfin, BookOrbit)
    # =========================================================================
	ip saddr $NET_ARR ip daddr $IP_MEDIA tcp dport $PORT_JELLYFIN accept
	ip saddr $NET_ARR ip daddr $IP_MEDIA tcp dport $PORT_BOOKORBIT accept

	ip saddr $NET_ARR ip daddr $NET_ALL_INTERNAL drop

	ip saddr $NET_ARR oifname $WAN_IF accept

    # =========================================================================
    # SECTION: PRIVNET VLAN (113), Internet + Media (Jellyfin, Seerr) + Photos + *Arr
    # =========================================================================
	ip saddr $NET_PRIVNET ip daddr $IP_MEDIA tcp dport $PORT_JELLYFIN accept
	ip saddr $NET_PRIVNET ip daddr $IP_MEDIA tcp dport $PORT_SEERR accept
	ip saddr $NET_PRIVNET ip daddr $IP_MEDIA tcp dport $PORT_BOOKORBIT accept

	ip saddr $NET_PRIVNET ip daddr $IP_PHOTOS tcp dport $PORT_IMMICH accept

	# TODO: *arr services

	ip saddr $NET_PRIVNET ip daddr $IP_HAOS tcp dport $PORT_HAOS accept

	ip saddr $NET_PRIVNET ip daddr $NET_ALL_INTERNAL drop

	ip saddr $NET_PRIVNET oifname $WAN_IF accept

    # =========================================================================
    # SECTION: HAOS VLAN (114), Internet + local LAN
    # =========================================================================
	ip saddr $NET_HAOS ip daddr $NET_LAN accept

	ip saddr $NET_HAOS ip daddr $NET_ALL_INTERNAL drop

	ip saddr $NET_HAOS oifname $WAN_IF accept

    # =========================================================================
    # SECTION: MISC VLAN (116), Only internet access
    # =========================================================================
	ip saddr $NET_MISC ip daddr $NET_ALL_INTERNAL drop

    ip saddr $NET_MISC oifname $WAN_IF accept

    # =========================================================================
    # CATCH-ALL: Log and drop unmatched forward attempts (final drop rule)
    # =========================================================================
    log prefix "FORWARD-DROP: " level warn drop
}
