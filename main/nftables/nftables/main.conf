#!/usr/sbin/nft -f

# =============================================================================
# Proxmox Host Firewall, main entry point
# Edit vars.conf to change IPs/ports. Edit sets.conf to change host groups.
# =============================================================================

flush ruleset

include "/etc/nftables/vars.conf"

table inet filter {
    include "/etc/nftables/chains/input.conf"
    include "/etc/nftables/chains/forward.conf"
}

table ip nat {
    include "/etc/nftables/chains/nat.conf"
}
