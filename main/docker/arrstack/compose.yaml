networks:
  internalnetwork:
    external: true

  externalnetwork:
    external: true

services:
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    # user: ${PUID}:${PGID} # This container requires joining another containers network
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./jackett:/config
      - /etc/localtime:/etc/localtime:ro
    network_mode: container:vpn1
    healthcheck:
      test: sh -c "ping -c1 1.1.1.1 && nslookup www.google.com && wget -qO- http://localhost:9117/health"
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    # user: ${PUID}:${PGID} # This container requires joining another containers network
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./prowlarr:/config
      - /etc/localtime:/etc/localtime:ro
    network_mode: container:vpn1
    healthcheck:
      test: sh -c "ping -c1 1.1.1.1 && nslookup www.google.com && wget -qO- http://localhost:9696 && curl -s http://localhost:9696/ping"
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    # user: ${PUID}:${PGID} # linuxserver containers handle this with environment PUID, PGID
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./sonarr:/config
      - /mnt/nas:/mnt/nas
      - ${SERIES_FOLDER}:/tv
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 8989:8989
    networks:
      internalnetwork:
        ipv4_address: 172.39.0.40
    healthcheck:
      test: sh -c "wget -qO- http://localhost:8989 && curl -s http://localhost:8989/ping"
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    # user: ${PUID}:${PGID} # linuxserver containers handle this with environment PUID, PGID
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./radarr:/config
      - /mnt/nas:/mnt/nas
      - ${MOVIES_FOLDER}:/movies
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 7878:7878
    networks:
      internalnetwork:
        ipv4_address: 172.39.0.41
    healthcheck:
      test: sh -c "wget -qO- http://localhost:7878 && curl -s http://localhost:7878/ping"
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  lidarr:
    container_name: lidarr
    image: lscr.io/linuxserver/lidarr:nightly
    # user: ${PUID}:${PGID} # linuxserver containers handle this with environment PUID, PGID
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./lidarr:/config
      - /mnt/nas:/mnt/nas
      - ${MUSIC_FOLDER}:/music
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 8686:8686
    networks:
      internalnetwork:
        ipv4_address: 172.39.0.42
    healthcheck:
      test: sh -c "wget -qO- http://localhost:8686 && curl -s http://localhost:8686/ping"
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    # user: ${PUID}:${PGID} # linuxserver containers handle this with environment PUID, PGID
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./bazarr:/config
      - /mnt/nas:/mnt/nas
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 6767:6767
    networks:
      internalnetwork:
        ipv4_address: 172.39.0.43
    healthcheck:
      test: curl -s http://localhost:6767
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  subsyncarr:
    image: mrorbitman/subsyncarr:latest
    container_name: subsyncarr
    user: ${PUID}:${PGID}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - CRON_SCHEDULE=0 0 * * * # Runs every day at midnight by default
      - SCAN_PATHS=/movies,/tv
      - MAX_CONCURRENT_SYNC_TASKS=${SUBTITLE_SYNC_MAX_JOBS} # Higher = faster sync, but higher CPU usage
      - INCLUDE_ENGINES=ffsubsync
    volumes:
      - ${MOVIES_FOLDER}:/movies
      - ${SERIES_FOLDER}:/tv
      - /etc/localtime:/etc/localtime:ro
    networks:
      internalnetwork:
        ipv4_address: 172.39.0.44
    healthcheck:
      test: pgrep -f startup.sh
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
