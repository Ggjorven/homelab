networks:
  search-network:
    name: search-network
    external: true

services:
  searxng-core:
    image: docker.io/searxng/searxng:latest
    container_name: searxng-core
    volumes:
      - ./config:/etc/searxng
      - ./data:/var/cache/searxng
    networks:
      search-network:
        ipv4_address: 172.24.1.10
    ports:
      - "0.0.0.0:8888:8888"
    healthcheck:
      test: wget -qO- http://localhost:8080/healthz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      searxng-valkey:
        condition: service_healthy
    restart: always

  searxng-valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: searxng-valkey
    volumes:
      - ./valkey:/data
    networks:
      search-network:
        ipv4_address: 172.24.1.11
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: valkey-cli ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command: valkey-server --save 30 1 --loglevel warning
    restart: always

  # TODO: Prometheus exporter
