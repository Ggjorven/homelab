networks:
  search-network:
    name: search-network
    external: true

services:
  searxng-core:
    image: docker.io/searxng/searxng:latest
    container_name: searxng-core
    environment:
      - SEARXNG_BIND_ADDRESS=0.0.0.0
      - SEARXNG_PORT=8888
      - SEARXNG_BASE_URL=${BASE_DOMAIN:+https://searxng.local.${BASE_DOMAIN}}
      - SEARXNG_PUBLIC_INSTANCE=false
      - SEARXNG_SECRET=${SECRET_KEY}
      - SEARXNG_IMAGE_PROXY=true
      - SEARXNG_METHOD=GET
      - SEARXNG_VALKEY_URL=valkey://172.24.1.11:6379/0
    volumes:
      - ./config:/etc/searxng
      - ./data:/var/cache/searxng
      - /etc/localtime:/etc/localtime:ro
    networks:
      search-network:
        ipv4_address: 172.24.1.10
    ports:
      - "0.0.0.0:8888:8888"
    healthcheck:
      test: >- 
        wget -qO- --header='X-Real-IP: 127.0.0.1' http://localhost:8888/healthz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      searxng-valkey:
        condition: service_healthy
    restart: always

  searxng-valkey:
    image: docker.io/valkey/valkey:9-alpine
    container_name: searxng-valkey
    volumes:
      - ./valkey:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      search-network:
        ipv4_address: 172.24.1.11
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: valkey-cli ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command: valkey-server --save 30 1 --loglevel warning
    restart: always

  # TODO: Prometheus exporter
