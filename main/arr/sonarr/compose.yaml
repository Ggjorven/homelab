networks:
  arr-network:
    name: arr-network
    external: true

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: radarr
    # user: ${PUID}:${PGID} # linuxserver containers handle this with environment PUID, PGID
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config:/config
      - ${DOWNLOADS_FOLDER}:/downloads:ro
      - ${SERIES_FOLDER}:/tv
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "0.0.0.0:8989:8989"
    networks:
      arr-network:
        ipv4_address: 172.24.1.14
    healthcheck:
      test: sh -c "wget -qO- http://localhost:8989 && curl -s http://localhost:8989/ping"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
