networks:
  arr-network:
    name: arr-network
    external: true

services:
  shelfarr:
    image: ghcr.io/pedro-revez-silva/shelfarr:latest
    container_name: shelfarr
    # user: ${PUID}:${PGID} # shelfarr handles this with environment PUID, PGID
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - HTTP_PORT=5056
      - CHOWN_ON_START=auto
      - TRUST_NFS_UID_SQUASH=true
      - SOLID_QUEUE_IN_PUMA=1
    volumes:
      - ./config:/rails/storage
      - ${DOWNLOADS_FOLDER}:/downloads
      - ${EBOOKS_FOLDER}:/ebooks
      - ${AUDIOBOOKS_FOLDER}:/audiobooks
      - /etc/localtime:/etc/localtime:ro
    network_mode: container:vpn1
    healthcheck:
      test: sh -c "curl -s www.google.com && curl -s http://localhost:5056 && curl -s http://localhost:5056/up" # curl google.com replaces ping and nslookup for internet connectivity test
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
