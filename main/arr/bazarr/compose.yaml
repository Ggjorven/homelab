networks:
  arr-network:
    name: arr-network
    external: true

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    # user: ${PUID}:${PGID} # linuxserver containers handle this with environment PUID, PGID
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config:/config
      - ${MOVIES_FOLDER}:/movies
      - ${SERIES_FOLDER}:/tv
      - /etc/localtime:/etc/localtime:ro
    networks:
      arr-network:
        ipv4_address: 172.24.1.16
    ports:
      - "0.0.0.0:6767:6767"
    healthcheck:
      test: sh -c "wget -qO- http://localhost:6767 && curl -s http://localhost:6767/ping"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
